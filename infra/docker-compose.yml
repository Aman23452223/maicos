services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: os
      POSTGRES_PASSWORD: os
      POSTGRES_DB: os
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg2://os:os@postgres:5432/os
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-secret}
      WORKER_ENABLED: "true"
    volumes: ["../backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    volumes: ["../frontend:/app"]
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
