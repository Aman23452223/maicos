name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

# Cancel in-progress runs of the same workflow on the same branch.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: os
          POSTGRES_PASSWORD: os
          POSTGRES_DB: os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://os:os@localhost:5432/os
      APP_SECRET_KEY: ci-secret-not-for-prod
      WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install openai anthropic PyPDF2 python-docx

      - name: Apply migrations
        run: alembic upgrade head

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type-check (mypy)
        run: mypy app tests

      - name: Test (pytest)
        run: pytest -q
